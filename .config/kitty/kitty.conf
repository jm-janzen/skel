kitty_mod alt+ctrl+shift

linux_display_server wayland

enable_audio_bell yes
# NOTE This NEEDS to be named `bell.wav`
bell_path ~/.config/kitty/bell.wav
window_alert_on_bell yes
visual_bell_duration 0.015
visual_bell_color red

enabled_layouts Splits, stack

# Zoom active window (split)
map kitty_mod+z toggle_layout stack

map kitty_mod+s load_config_file

map kitty_mod+, launch --cwd=current --location=hsplit
map kitty_mod+. launch --cwd=current --location=vsplit

# To allow navigating between nvim splits and kitty windows
# using vim-kitty-navigator
allow_remote_control yes
listen_on unix:@mykitty

# TODO Fix this not working with my 'writing_mode'
map ctrl+shift+j kitten pass_keys.py bottom ctrl+j
map ctrl+shift+k kitten pass_keys.py top    ctrl+k
map ctrl+shift+h kitten pass_keys.py left   ctrl+h
map ctrl+shift+l kitten pass_keys.py right  ctrl+l

# FIXME Could probably jig around and make this kitty_mod+<DIRECTION> instead
map ctrl+left  move_window left
map ctrl+right move_window right
map ctrl+down  move_window bottom
map ctrl+up    move_window top

map kitty_mod+t launch --cwd=current --type=tab
map kitty_mod+u kitten unicode_input --emoji-variation=graphic

# Open vim scratch buffer of current scrollback with cursor at end
map kitty_mod+k pipe @screen_scrollback overlay vim "+normal G$" +noswapfile +"set buftype=nofile" +"set bufhidden=hide" - -c 'set filetype=kitty_scrollback'

# Style

tab_bar_style separator
tab_separator " ┇ "
tab_bar_align left

cursor_trail 1

# Other

# TODO Right-click to rename kitty tab? Like command:
#   kitty @ set-tab-title compare

# BEGIN_KITTY_THEME
# Argonaut
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="Noto Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Use builtin kitty NERD font
# https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
